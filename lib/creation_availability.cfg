# Global character-creation availability.
#
# This file is loaded at server boot. Restart the server after changing it.
# A missing setting defaults to true, preserving the existing creation menu.
# Use true to show/allow an option and false to hide/reject it.
#
# Class names use the normalized names listed below. Race names use hyphens where
# the in-game name contains spaces. These switches apply to both telnet and
# WebSocket character creation; they do not change existing characters.
#
# Dragoon is intentionally disabled by default per the current server policy.

# Classes
